# blog-h5：构建前台静态站并上传到云服务器
# 触发：push 到 main，或手动 Run workflow
# 需要的 Secrets：SERVER_HOST / SERVER_USER(ubuntu) / SERVER_SSH_KEY
# 静态文件是 bind mount，上传后 Nginx 立即生效，无需重启

name: Deploy H5 Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: 构建静态站 (vite-ssg → dist/)
        run: npm run build

      - name: 上传 dist 到 /opt/blog/frontend_dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: "/opt/blog/frontend_dist"
          strip_components: 1
