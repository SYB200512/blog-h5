# blog-h5：构建前台静态站并上传到云服务器
# 触发：push 到 main，或手动 Run workflow
# 需要的 Secrets：SERVER_HOST / SERVER_USER(ubuntu) / SERVER_SSH_KEY
# 静态文件是 bind mount，上传后 Nginx 立即生效，无需重启

name: Deploy H5 Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # 防止网络问题导致无限挂起
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: 构建静态站 (vite-ssg → dist/)
        run: npm run build

      - name: 打包 dist 并上传解压（服务器端校验，抗网络抖动）
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          echo "$KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          tar czf /tmp/dist.tar.gz -C dist .
          # 国内网络下 scp 退出码不可靠：文件传完后连接可能迟迟不关闭导致误报失败。
          # 因此忽略 scp 退出码，改用服务器端 stat 校验文件大小，一致后解压。
          LOCAL_SIZE=$(stat -c %s /tmp/dist.tar.gz)
          for i in 1 2 3 4 5; do
            echo "== 上传尝试 $i（本地 $LOCAL_SIZE 字节）=="
            scp -C -i /tmp/ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
                /tmp/dist.tar.gz "${USER}@${HOST}:/tmp/blog_h5_dist.tar.gz" || true
            REMOTE_SIZE=$(ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=30 "${USER}@${HOST}" \
                "stat -c %s /tmp/blog_h5_dist.tar.gz 2>/dev/null" || echo 0)
            echo "远程大小: ${REMOTE_SIZE:-0}"
            if [ "$LOCAL_SIZE" = "${REMOTE_SIZE:-0}" ]; then
              EXTRACT=$(ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                  -o ConnectTimeout=30 "${USER}@${HOST}" \
                  "mkdir -p /opt/blog/frontend_dist && tar xzf /tmp/blog_h5_dist.tar.gz -C /opt/blog/frontend_dist && rm -f /tmp/blog_h5_dist.tar.gz && echo EXTRACT_OK")
              if [ "$EXTRACT" = "EXTRACT_OK" ]; then
                echo "上传并解压成功（第 $i 次）"
                break
              fi
              echo "解压未确认，20 秒后重试"; sleep 20
            else
              echo "第 $i 次校验不符，20 秒后重试"; sleep 20
            fi
          done
          if [ "$LOCAL_SIZE" != "${REMOTE_SIZE:-0}" ]; then
            echo "上传最终校验失败"; exit 1
          fi
