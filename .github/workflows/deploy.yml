# blog-h5：构建前台静态站并上传到云服务器
# 触发：push 到 main，或手动 Run workflow
# 需要的 Secrets：SERVER_HOST / SERVER_USER(ubuntu) / SERVER_SSH_KEY
# 静态文件是 bind mount，上传后 Nginx 立即生效，无需重启

name: Deploy H5 Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # 防止网络问题导致无限挂起
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: 构建静态站 (vite-ssg → dist/)
        run: npm run build

      - name: 打包 dist 并上传解压（单文件传输，抗网络抖动）
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          echo "$KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          tar czf /tmp/dist.tar.gz -C dist .
          for i in 1 2 3 4 5; do
            echo "== 上传尝试 $i =="
            if scp -C -i /tmp/ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
                   /tmp/dist.tar.gz "${USER}@${HOST}:/tmp/blog_h5_dist.tar.gz"; then
              ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                  "${USER}@${HOST}" "mkdir -p /opt/blog/frontend_dist && tar xzf /tmp/blog_h5_dist.tar.gz -C /opt/blog/frontend_dist && rm -f /tmp/blog_h5_dist.tar.gz && echo EXTRACT_OK"
              break
            else
              echo "尝试 $i 失败，20 秒后重试"; sleep 20
            fi
          done
